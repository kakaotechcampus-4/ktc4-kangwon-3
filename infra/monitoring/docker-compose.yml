name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: mon-prometheus
    restart: unless-stopped
    mem_limit: 384m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    # host 네트워크에서 도는 node-exporter에 접근하기 위한 docker0 게이트웨이
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [monitoring, be_appnet]

  # 호스트 eth0 트래픽을 보려면 host 네트워크가 필요하고
  # 외부 노출을 막기 위해 0.0.0.0이 아닌 docker0 게이트웨이(172.17.0.1)에만 바인딩
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: mon-node-exporter
    restart: unless-stopped
    mem_limit: 64m
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=172.17.0.1:9100
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    volumes:
      - /:/host:ro,rslave

  grafana:
    image: grafana/grafana:12.1.0
    container_name: mon-grafana
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD를 .env에 설정해주세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/grafana/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [monitoring]

  # 컨테이너별 CPU·메모리(mem_limit 대비)·OOM 확인용
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: mon-cadvisor
    restart: unless-stopped
    mem_limit: 128m
    cap_add: [SYSLOG]
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --containerd=/var/run/containerd/containerd.sock
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --enable_metrics=cpu,memory,oom_event
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
  be_appnet:
    external: true
