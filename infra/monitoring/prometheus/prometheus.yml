global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["mon-cadvisor:8080"]

  - job_name: be-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["be-server:8081"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          instance: ec2-app
