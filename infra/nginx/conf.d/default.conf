# HTTP: ACME 챌린지 응답 + HTTPS 리다이렉트
#
# 주의: server 블록 레벨의 `if`는 location 매칭보다 먼저 실행되므로
#       ACME 경로를 살리려면 리다이렉트를 반드시 `location /` 안에 둬야 한다.
server {
    listen 80;
    server_name palgijeone.com www.palgijeone.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name palgijeone.com www.palgijeone.com;

    ssl_certificate     /etc/letsencrypt/live/palgijeone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/palgijeone.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /home/ubuntu/app/frontend/current;
    index index.html;

    # Cloudflare 프록시가 오리진을 443으로 조회하는 경우에도 ACME 챌린지 응답
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /swagger-ui/      {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location = /v3/api-docs    {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location = /v3/api-docs/   {
        proxy_pass http://127.0.0.1:8080/v3/api-docs;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location /v3/api-docs/     {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location /api/             {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location /oauth2/          {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location /login/oauth2/    {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location /error-codes      {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

