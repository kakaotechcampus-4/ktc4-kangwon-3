server {
    listen 80;
    server_name palgijeone.com www.palgijeone.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name palgijeone.com www.palgijeone.com;

    resolver 127.0.0.11 valid=10s;
    set $upstream_app app:8080;

    ssl_certificate     /etc/letsencrypt/live/palgijeone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/palgijeone.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /swagger-ui/      { proxy_pass http://$upstream_app; include /etc/nginx/conf.d/proxy.inc; }
    location = /v3/api-docs    { proxy_pass http://$upstream_app; include /etc/nginx/conf.d/proxy.inc; }
    location = /v3/api-docs/   { proxy_pass http://$upstream_app/v3/api-docs; include /etc/nginx/conf.d/proxy.inc; }
    location /v3/api-docs/     { proxy_pass http://$upstream_app; include /etc/nginx/conf.d/proxy.inc; }
    location /api/             { proxy_pass http://$upstream_app; include /etc/nginx/conf.d/proxy.inc; }
    location /oauth2/          { proxy_pass http://$upstream_app; include /etc/nginx/conf.d/proxy.inc; }
    location /login/oauth2/    { proxy_pass http://$upstream_app; include /etc/nginx/conf.d/proxy.inc; }
    location /error-codes      { proxy_pass http://$upstream_app; include /etc/nginx/conf.d/proxy.inc; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
