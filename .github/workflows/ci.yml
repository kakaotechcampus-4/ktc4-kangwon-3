name: Backend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/beforeselling/**"
  push:
    branches: [develop]
    paths:
      - "backend/beforeselling/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/beforeselling
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle 설정 
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 및 테스트
        run: ./gradlew build

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/beforeselling/build/reports/tests/test
