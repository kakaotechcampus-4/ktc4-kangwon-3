name: Backend CI/CD

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/beforeselling/**"
  push:
    branches: [develop]
    paths:
      - "backend/beforeselling/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  APP_DIR: /home/ubuntu/app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/beforeselling
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 및 테스트
        run: ./gradlew build

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/beforeselling/build/reports/tests/test

      - name: 빌드 산출물(jar) 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/beforeselling/build/libs/app.jar
          retention-days: 1

  deploy:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 빌드 산출물(jar) 내려받기
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: backend/beforeselling/build/libs

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: 이미지 빌드 및 업로드
        run: |
          docker build --target deploy \
            -t "beforeselling-app:${GITHUB_SHA}" \
            -t "beforeselling-app:latest" \
            backend/beforeselling
          docker save \
            "beforeselling-app:${GITHUB_SHA}" \
            "beforeselling-app:latest" \
            | gzip > /tmp/app-image.tar.gz
          aws s3 cp /tmp/app-image.tar.gz "s3://${S3_BUCKET}/app-image-${GITHUB_SHA}.tar.gz"
          aws s3 cp backend/beforeselling/docker-compose.yml \
            "s3://${S3_BUCKET}/docker-compose-${GITHUB_SHA}.yml"
          aws s3 cp backend/beforeselling/docker-compose.prod.yml \
            "s3://${S3_BUCKET}/docker-compose-prod-${GITHUB_SHA}.yml"

      - name: 배포 실행
        uses: ./.github/actions/ssm-run
        with:
          instance-id: ${{ vars.INSTANCE_ID }}
          label: be deploy
          commands: |
            aws s3 cp s3://${{ env.S3_BUCKET }}/app-image-${{ github.sha }}.tar.gz /tmp/app-image.tar.gz
            gunzip -c /tmp/app-image.tar.gz | docker load
            rm -rf ${{ env.APP_DIR }}/release && mkdir -p ${{ env.APP_DIR }}/release
            aws s3 cp s3://${{ env.S3_BUCKET }}/docker-compose-${{ github.sha }}.yml ${{ env.APP_DIR }}/release/docker-compose.yml
            aws s3 cp s3://${{ env.S3_BUCKET }}/docker-compose-prod-${{ github.sha }}.yml ${{ env.APP_DIR }}/release/docker-compose.prod.yml
            cp ${{ env.APP_DIR }}/.env ${{ env.APP_DIR }}/release/.env
            cd ${{ env.APP_DIR }}/release
            IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180 || { docker compose -f docker-compose.yml -f docker-compose.prod.yml ps; docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 100 app; exit 1; }
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
            docker image prune -a -f
