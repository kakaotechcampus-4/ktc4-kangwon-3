name: Backend CI/CD

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/beforeselling/**"
  push:
    branches: [develop]
    paths:
      - "backend/beforeselling/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  ECR_REPOSITORY: beforeselling-app
  APP_DIR: /home/ubuntu/app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/beforeselling
    steps:
      - uses: actions/checkout@v4

      - name: 배포 스크립트 검사
        run: |
          shellcheck deploy/blue-green.sh deploy/test/blue-green.test.sh
          bash deploy/test/blue-green.test.sh

      - name: 운영 compose 병합 검사
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: JDK 25 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 및 테스트
        run: ./gradlew build

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/beforeselling/build/reports/tests/test

      - name: 빌드 산출물(jar) 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/beforeselling/build/libs/app.jar
          retention-days: 1

  deploy:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # job 레벨이라 PR CI는 막지 않는다. 서버에서의 겹침(SSM 타임아웃 후에도 도는 스크립트, 수동 rollback)은 flock이 막는다.
    concurrency:
      group: be-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: .env 준비
        env:
          ENV_B64: ${{ secrets.BE_ENV_B64 }}
        run: |
          [ -n "$ENV_B64" ] || { echo "::error::BE_ENV_B64 Secret이 비어 있습니다"; exit 1; }
          umask 077
          printf '%s' "$ENV_B64" | base64 -d > "$RUNNER_TEMP/be.env" || { echo "::error::BE_ENV_B64 Base64 디코딩 실패"; exit 1; }
          [ -s "$RUNNER_TEMP/be.env" ] || { echo "::error::BE_ENV_B64 디코딩 결과가 비어 있습니다"; exit 1; }

      - name: 빌드 산출물(jar) 내려받기
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: backend/beforeselling/build/libs

      - name: AWS 자격증명 설정
        id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 ECR push
        uses: docker/build-push-action@v6
        with:
          context: backend/beforeselling
          target: deploy
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha

      - name: 배포 파일 업로드
        run: |
          aws s3 cp backend/beforeselling/docker-compose.yml \
            "s3://${S3_BUCKET}/docker-compose-${GITHUB_SHA}.yml"
          aws s3 cp backend/beforeselling/docker-compose.prod.yml \
            "s3://${S3_BUCKET}/docker-compose-prod-${GITHUB_SHA}.yml"
          aws s3 cp backend/beforeselling/deploy/blue-green.sh \
            "s3://${S3_BUCKET}/blue-green-${GITHUB_SHA}.sh"
          aws s3 cp "$RUNNER_TEMP/be.env" "s3://${S3_BUCKET}/env/be-${GITHUB_SHA}.env"

      # Blue-Green 전환은 blue-green.sh가 한다 (backend/beforeselling/deploy/README.md).
      # release 디렉터리 교체까지 같은 락 안에서 해야 진행 중인 배포/롤백의 파일을 덮어쓰지 않는다.
      - name: 배포 실행
        uses: ./.github/actions/ssm-run
        with:
          instance-id: ${{ vars.INSTANCE_ID }}
          label: be deploy
          max-attempts: "90"
          commands: |
            exec 9>/var/lock/be-deploy.lock
            flock -w 600 9
            export BE_DEPLOY_LOCK_HELD=1
            ECR_IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}
            docker pull -q "$ECR_IMAGE"
            docker logout ${{ steps.ecr.outputs.registry }}
            docker tag "$ECR_IMAGE" beforeselling-app:${{ github.sha }}
            docker tag "$ECR_IMAGE" beforeselling-app:latest
            rm -rf ${{ env.APP_DIR }}/release && mkdir -p ${{ env.APP_DIR }}/release
            aws s3 cp s3://${{ env.S3_BUCKET }}/docker-compose-${{ github.sha }}.yml ${{ env.APP_DIR }}/release/docker-compose.yml
            aws s3 cp s3://${{ env.S3_BUCKET }}/docker-compose-prod-${{ github.sha }}.yml ${{ env.APP_DIR }}/release/docker-compose.prod.yml
            aws s3 cp s3://${{ env.S3_BUCKET }}/blue-green-${{ github.sha }}.sh ${{ env.APP_DIR }}/release/blue-green.sh
            (umask 077; aws s3 cp s3://${{ env.S3_BUCKET }}/env/be-${{ github.sha }}.env ${{ env.APP_DIR }}/.env)
            chmod 600 ${{ env.APP_DIR }}/.env
            cp ${{ env.APP_DIR }}/.env ${{ env.APP_DIR }}/release/.env
            cd ${{ env.APP_DIR }}/release
            docker network inspect be-ai-net >/dev/null 2>&1 || docker network create be-ai-net
            bash blue-green.sh deploy ${{ github.sha }}
            docker ps -a --filter name=be-server --format '{{.Names}} {{.Image}} {{.Status}}'
            docker image prune -a -f

      - name: .env 정리
        if: always() && steps.aws.outcome == 'success'
        run: aws s3 rm "s3://${S3_BUCKET}/env/be-${GITHUB_SHA}.env"

      # 전환 후 외부 경로(Cloudflare → nginx → 새 색)까지 확인한다. 실패하면 README의 rollback 절차를 따른다.
      - name: 서비스 확인
        run: |
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 https://palgijeone.com/v3/api-docs)
          echo "api : ${CODE}"
          [ "$CODE" = "200" ] || { echo "::error::배포 후 백엔드 응답 이상 (${CODE}) - 필요하면 blue-green.sh rollback"; exit 1; }
