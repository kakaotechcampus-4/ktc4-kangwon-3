name: Assign part reviewers
#
# 파트별 **리뷰 요청**을 자동으로 건다. 승인을 강제하지는 않는다.
#
# ⭐ 왜 CODEOWNERS 가 아니라 워크플로인가 (2026-09-10, 강원대 3팀 사례)
#   CODEOWNERS 는 "리뷰 요청" 과 "승인 강제" 가 **한 덩어리**다. 파트 오너를 넣으면
#   `main` 룰셋의 `require_code_owner_review` 때문에 **매칭된 경로마다 오너 승인이 필요**해진다.
#   주간 `develop → main` PR 은 그 주 작업 전체를 올리므로 backend·frontend·ai 를 대개 다 건드리고,
#   그러면 멘토 1명 + 파트 오너 3명 = **매주 4명 승인**이 일요일 23:59 마감 앞에 걸린다.
#   작성자는 자기 PR 을 승인할 수 없어 실질 인원은 더 늘어난다.
#   → 요청만 하는 이 워크플로로 옮기면 **리뷰 요청은 그대로, 머지는 안 막힌다.**
#     승인 관문은 룰셋 하나가 담당한다(멘토 1명) — 요청과 관문을 분리한다.
#
# ⭐ `branches: [develop]` 인 이유
#   팀 내부 PR 에만 건다. `develop → main` 주간 PR 은 멘토가 리뷰어이므로 파트 리뷰어를 또 부르지 않는다.
#
# 🚨 이 파일은 **팀 소유**다. 파트 구성이 바뀌면 아래 MAP 만 고치면 된다.
#   운영진에게 요청할 필요 없다.
#
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  assign:
    # draft 에는 걸지 않는다 — 아직 볼 준비가 안 된 PR 로 사람을 부르면 리뷰 요청 자체가 무시된다.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request reviewers by changed path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # ── 여기만 고치면 됩니다 ──────────────────────────────
          #   형식: <경로 접두사><공백><리뷰어 GitHub 아이디...>
          MAP: |
            backend/   Homeria niceome hyotatoFrappuccino
            frontend/  SumiNK03 niceome
            ai/        gkrdls Homeria gityhb
          # ────────────────────────────────────────────────────
        run: |
          set -euo pipefail

          # 🚨 조회 실패를 '변경 파일 없음' 으로 삼키지 않는다.
          #   빈 목록으로 진행하면 아무도 안 불리는데 워크플로는 초록불이 된다.
          if ! FILES=$(gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate --jq '.[].filename'); then
            echo "::error::변경 파일 조회 실패 — 리뷰어를 지정하지 않았습니다 (PR #$PR)"
            exit 1
          fi

          PICKED=""
          while IFS= read -r line; do
            [ -n "${line// }" ] || continue
            prefix=$(printf '%s\n' "$line" | awk '{print $1}')
            people=$(printf '%s\n' "$line" | cut -d' ' -f2- )
            if printf '%s\n' "$FILES" | grep -q "^$prefix"; then
              PICKED="$PICKED $people"
            fi
          done <<< "$MAP"

          # 작성자는 뺀다 — 자기 PR 은 승인할 수 없고, 넣으면 API 가 요청 전체를 거부한다.
          FINAL=$(printf '%s\n' $PICKED | tr -d ' ' | grep -v "^$" | sort -u | grep -vix "$AUTHOR" || true)

          if [ -z "$FINAL" ]; then
            echo "해당 파트 없음 또는 작성자 본인뿐 — 지정할 리뷰어 없음 (PR #$PR)"
            exit 0
          fi

          echo "지정 대상: $(printf '%s ' $FINAL)"

          # 🚨 한 명씩 건다. 한 번에 넘기면 아이디 하나가 잘못됐을 때 **전원이 안 걸린다**
          #   (이미 리뷰어인 사람, 조직을 떠난 계정 등). 개별 실패는 경고로 남기고 계속 간다.
          ok=0; fail=0
          for u in $FINAL; do
            if gh pr edit "$PR" -R "$REPO" --add-reviewer "$u" >/dev/null 2>&1; then
              ok=$((ok+1))
            else
              echo "::warning::리뷰어 지정 실패: $u (이미 지정됐거나 권한이 없을 수 있습니다)"
              fail=$((fail+1))
            fi
          done

          echo "완료: 지정 $ok · 실패 $fail"
          # 전원 실패면 조용히 넘어가지 않는다.
          if [ "$ok" -eq 0 ] && [ "$fail" -gt 0 ]; then
            echo "::error::리뷰어를 한 명도 지정하지 못했습니다 (PR #$PR)"
            exit 1
          fi
