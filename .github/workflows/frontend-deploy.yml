name: Deploy Frontend to EC2

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: ktc4-kangwon3-deploy
  APP_DIR: /home/ubuntu/app
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    # Frontend CI가 push(develop)로 성공 완료했을 때만 배포한다.
    # (PR 이벤트로 돈 CI 완료는 배포 대상이 아니다.)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/palgijeonae
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Node 22 설치
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/palgijeonae/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run build

      # AWS 인증
      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # S3 업로드 (BE와 같은 버킷, frontend/ 경로로 분리)
      - name: 빌드 결과물 업로드
        run: |
          tar czf /tmp/frontend.tar.gz -C dist .
          aws s3 cp /tmp/frontend.tar.gz "s3://${S3_BUCKET}/frontend/dist-${DEPLOY_SHA}.tar.gz"

      # 서버 꺼져있으면 켜서 SSM 대기 (BE deploy.yml과 동일한 로직)
      - name: 서버 준비
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids "${{ vars.INSTANCE_ID }}" \
                  --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "현재 상태: $STATE"
          if [ "$STATE" != "running" ]; then
            echo "서버를 시작합니다..."
            aws ec2 start-instances --instance-ids "${{ vars.INSTANCE_ID }}"
            aws ec2 wait instance-running --instance-ids "${{ vars.INSTANCE_ID }}"
          fi
          echo "SSM 에이전트 연결 대기..."
          for i in $(seq 1 30); do
            PING=$(aws ssm describe-instance-information \
                   --filters "Key=InstanceIds,Values=${{ vars.INSTANCE_ID }}" \
                   --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "")
            if [ "$PING" = "Online" ]; then echo "준비 완료"; exit 0; fi
            sleep 10
          done
          echo "::error::SSM 에이전트가 응답하지 않습니다"; exit 1

      # SSM 배포: 새 release를 별도 디렉터리에 완전히 내려받은 뒤에만
      # 심볼릭 링크(current)를 원자적으로 교체한다.
      # 실패 시 이전 명령에서 중단되므로 기존 current는 그대로 유지된다.
      - name: 배포 실행
        run: |
          RELEASE_DIR="${APP_DIR}/frontend/releases/${DEPLOY_SHA}"
          CURRENT_LINK="${APP_DIR}/frontend/current"

          cat > /tmp/params.json <<EOF
          {"commands":[
            "#!/bin/bash",
            "set -euo pipefail",
            "mkdir -p ${RELEASE_DIR}",
            "aws s3 cp s3://${S3_BUCKET}/frontend/dist-${DEPLOY_SHA}.tar.gz /tmp/frontend-${DEPLOY_SHA}.tar.gz",
            "tar xzf /tmp/frontend-${DEPLOY_SHA}.tar.gz -C ${RELEASE_DIR}",
            "ln -sfn ${RELEASE_DIR} ${CURRENT_LINK}",
            "rm -f /tmp/frontend-${DEPLOY_SHA}.tar.gz"
          ]}
          EOF

          CMD=$(aws ssm send-command \
                --instance-ids "${{ vars.INSTANCE_ID }}" \
                --document-name AWS-RunShellScript \
                --comment "frontend deploy ${DEPLOY_SHA:0:7}" \
                --parameters file:///tmp/params.json \
                --query 'Command.CommandId' --output text)
          echo "CommandId: $CMD"

          for i in $(seq 1 30); do
            ST=$(aws ssm get-command-invocation --command-id "$CMD" \
                 --instance-id "${{ vars.INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          echo "----- 실행 로그 -----"
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "${{ vars.INSTANCE_ID }}" --query 'StandardOutputContent' --output text
          echo "----- 에러 로그 -----"
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "${{ vars.INSTANCE_ID }}" --query 'StandardErrorContent' --output text

          [ "$ST" = "Success" ] || { echo "::error::FE 배포 실패 ($ST)"; exit 1; }
