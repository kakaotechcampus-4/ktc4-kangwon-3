name: Deploy Frontend to EC2

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      sha:
        description: "배포할 커밋 SHA (비워두면 이 워크플로우를 실행하는 브랜치의 최신 커밋 사용 — Run workflow 드롭다운이 기본 브랜치로 되어 있을 수 있으니, 다른 브랜치를 테스트할 땐 여기에 SHA를 직접 입력할 것)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  APP_DIR: /home/ubuntu/app
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.sha || github.sha }}

jobs:
  deploy:
    # push로 성공한 CI만 배포 대상 (PR에서 돈 CI 완료는 제외)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/palgijeonae
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Node 22 설치
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/palgijeonae/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # BE와 같은 버킷을 쓰되 frontend/ 경로로 분리
      - name: 빌드 결과물 업로드
        run: |
          tar czf /tmp/frontend.tar.gz -C dist .
          aws s3 cp /tmp/frontend.tar.gz "s3://${S3_BUCKET}/frontend/dist-${DEPLOY_SHA}.tar.gz"

      # 새 release 디렉터리에 완전히 내려받은 뒤에만 current 심볼릭 링크를 교체한다.
      # (중간에 실패하면 기존 current가 그대로 유지됨)
      - name: 배포 실행
        uses: ./.github/actions/ssm-run
        with:
          instance-id: ${{ vars.INSTANCE_ID }}
          label: fe deploy
          sha: ${{ env.DEPLOY_SHA }}
          max-attempts: "30"
          poll-interval: "5"
          error-message: FE 배포 실패
          commands: |
            RELEASE_DIR=${{ env.APP_DIR }}/frontend/releases/${{ env.DEPLOY_SHA }}
            CURRENT_LINK=${{ env.APP_DIR }}/frontend/current
            mkdir -p $RELEASE_DIR
            aws s3 cp s3://${{ env.S3_BUCKET }}/frontend/dist-${{ env.DEPLOY_SHA }}.tar.gz /tmp/frontend-${{ env.DEPLOY_SHA }}.tar.gz
            tar xzf /tmp/frontend-${{ env.DEPLOY_SHA }}.tar.gz -C $RELEASE_DIR
            ln -sfn $RELEASE_DIR $CURRENT_LINK
            rm -f /tmp/frontend-${{ env.DEPLOY_SHA }}.tar.gz
