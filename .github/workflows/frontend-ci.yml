name: Frontend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "frontend/palgijeonae/**"
  push:
    branches: [develop]
    paths:
      - "frontend/palgijeonae/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/palgijeonae
    steps:
      - uses: actions/checkout@v4

      - name: Node 22 설치
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/palgijeonae/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      # 테스트와 커버리지 기준(vite.config.ts의 thresholds) 검사를 한 번에 돌린다. 기준에 못 미치면 실패한다.
      - name: 테스트 및 커버리지 검증
        run: npm run test:coverage

      - name: 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/palgijeonae/coverage
          if-no-files-found: ignore
          retention-days: 7

      - name: 빌드
        run: npm run build
