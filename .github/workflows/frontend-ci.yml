name: Frontend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "frontend/palgijeonae/**"
  push:
    branches: [develop]
    paths:
      - "frontend/palgijeonae/**"
  workflow_dispatch:
    inputs:
      skip-coverage:
        description: "커버리지 기준 검사를 건너뜀 (긴급 배포용)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/palgijeonae
    steps:
      - uses: actions/checkout@v4

      - name: Node 22 설치
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/palgijeonae/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      # 테스트와 커버리지 기준(vite.config.ts의 thresholds) 검사를 한 번에 돌린다. 기준에 못 미치면 실패한다.
      - name: 테스트 및 커버리지 검증
        id: test
        if: ${{ !inputs.skip-coverage }}
        run: npm run test:coverage

      # 수동 실행에서 skip-coverage를 켠 경우: 테스트는 그대로 돌리고 커버리지 기준 검사만 건너뛴다.
      - name: 테스트 (커버리지 검증 건너뜀)
        if: ${{ inputs.skip-coverage }}
        run: |
          echo "::warning::skip-coverage가 켜져 있어 커버리지 기준 검사를 건너뛰었습니다."
          echo "### ⚠️ 커버리지 기준 검사를 건너뛰었습니다 (skip-coverage)" >> "$GITHUB_STEP_SUMMARY"
          npm test

      - name: 긴급 배포 안내 (실패 시)
        if: failure() && steps.test.outcome == 'failure'
        run: echo "::notice::커버리지 기준 미달로 실패했다면, 긴급 상황에서는 Actions에서 Frontend CI를 수동 실행하고 skip-coverage를 켜면 됩니다. 배포는 Deploy Frontend to EC2를 수동 실행하세요."

      - name: 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/palgijeonae/coverage
          if-no-files-found: ignore
          retention-days: 7

      - name: 빌드
        run: npm run build
