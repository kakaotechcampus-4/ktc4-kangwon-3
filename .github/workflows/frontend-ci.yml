name: Frontend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "frontend/palgijeonae/**"
  push:
    branches: [develop]
    paths:
      - "frontend/palgijeonae/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/palgijeonae
    steps:
      - uses: actions/checkout@v4

      - name: Node 22 설치
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/palgijeonae/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 빌드
        run: npm run build
