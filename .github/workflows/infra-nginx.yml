name: Nginx 설정 배포

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "infra/nginx/**"
      - ".github/workflows/infra-nginx.yml"
  push:
    branches: [develop]
    paths:
      - "infra/nginx/**"
      - ".github/workflows/infra-nginx.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: nginx-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: ktc4-kangwon3-deploy
  APP_DIR: /home/ubuntu/app

jobs:
  validate:
    name: 문법 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 실서버에는 인증서가 있지만 CI 러너에는 없다.
      # nginx -t 가 인증서 파일을 실제로 읽으므로 더미를 만들어 준다.
      - name: 더미 인증서 생성
        run: |
          mkdir -p stub/live/palgijeone.com
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout stub/live/palgijeone.com/privkey.pem \
            -out    stub/live/palgijeone.com/fullchain.pem \
            -subj "/CN=palgijeone.com" 2>/dev/null
          openssl dhparam -out stub/ssl-dhparams.pem 2048
          : > stub/options-ssl-nginx.conf

      - name: nginx -t 실행
        run: |
          docker run --rm \
            -v "${PWD}/infra/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "${PWD}/stub:/etc/letsencrypt:ro" \
            nginx:alpine nginx -t

  deploy:
    name: 서버 반영
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: 설정 파일 업로드
        run: |
          aws s3 sync infra/nginx/conf.d \
            "s3://${S3_BUCKET}/nginx/${GITHUB_SHA}/" --delete

      - name: 서버 준비
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids "${{ vars.INSTANCE_ID }}" \
                  --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "현재 상태: $STATE"
          if [ "$STATE" != "running" ]; then
            echo "서버를 시작합니다..."
            aws ec2 start-instances --instance-ids "${{ vars.INSTANCE_ID }}"
            aws ec2 wait instance-running --instance-ids "${{ vars.INSTANCE_ID }}"
          fi
          echo "SSM 에이전트 연결 대기..."
          for i in $(seq 1 30); do
            PING=$(aws ssm describe-instance-information \
                   --filters "Key=InstanceIds,Values=${{ vars.INSTANCE_ID }}" \
                   --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "")
            if [ "$PING" = "Online" ]; then echo "준비 완료"; exit 0; fi
            sleep 10
          done
          echo "::error::SSM 에이전트가 응답하지 않습니다"; exit 1

      - name: 배포 및 reload
        run: |
          cat > /tmp/params.json <<EOF
          {"commands":[
            "#!/bin/bash",
            "set -euo pipefail",
            "NGINX_DIR=${APP_DIR}/infra/nginx/conf.d",
            "mkdir -p \$NGINX_DIR",
            "aws s3 sync s3://${S3_BUCKET}/nginx/${GITHUB_SHA}/ \$NGINX_DIR/ --delete",
            "for f in \$NGINX_DIR/*; do ln -sfn \$f /etc/nginx/conf.d/\$(basename \$f); done",
            "find /etc/nginx/conf.d -xtype l -delete",
            "if ! nginx -t; then echo 문법 검사 실패 - reload 하지 않았습니다; exit 1; fi",
            "systemctl reload-or-restart nginx",
            "echo 반영 완료"
          ]}
          EOF

          CMD=$(aws ssm send-command \
                --instance-ids "${{ vars.INSTANCE_ID }}" \
                --document-name AWS-RunShellScript \
                --comment "nginx ${GITHUB_SHA:0:7}" \
                --parameters file:///tmp/params.json \
                --query 'Command.CommandId' --output text)
          echo "CommandId: $CMD"

          for i in $(seq 1 30); do
            ST=$(aws ssm get-command-invocation --command-id "$CMD" \
                 --instance-id "${{ vars.INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          echo "----- 실행 로그 -----"
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "${{ vars.INSTANCE_ID }}" --query 'StandardOutputContent' --output text
          echo "----- 에러 로그 -----"
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "${{ vars.INSTANCE_ID }}" --query 'StandardErrorContent' --output text

          [ "$ST" = "Success" ] || { echo "::error::nginx 설정 배포 실패 ($ST)"; exit 1; }

      - name: 서비스 확인
        run: |
          # nginx 자체 동작
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 https://palgijeone.com/)
          echo "https : ${CODE}"
          [ "$CODE" = "200" ] || { echo "::error::메인 페이지 응답 이상 (${CODE})"; exit 1; }

          # ACME 경로 — 301 이면 인증서 자동 갱신이 조용히 깨진다
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 \
                 http://palgijeone.com/.well-known/acme-challenge/ci-probe)
          echo "acme  : ${CODE}"
          [ "$CODE" = "404" ] || { echo "::error::ACME 경로 이상 (${CODE}) — 갱신이 깨집니다"; exit 1; }

          # 백엔드 프록시 — 앱 컨테이너 상태에 좌우되므로 경고만
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 https://palgijeone.com/v3/api-docs)
          echo "api   : ${CODE}"
          [ "$CODE" = "200" ] || echo "::warning::백엔드 응답 ${CODE} — 앱 컨테이너 상태를 확인하세요"
