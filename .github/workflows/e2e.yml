name: E2E

# FE·BE·mock-ai를 함께 띄워 핵심 사용자 흐름을 브라우저로 검증한다.
# PR 체크는 아직 필수가 아니라 실패해도 병합할 수 있다.
on:
  pull_request:
    branches: [develop]
    paths:
      - "frontend/palgijeonae/**"
      - "backend/beforeselling/**"
      - "loadtest/mock-ai/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [develop]
    paths:
      - "frontend/palgijeonae/**"
      - "backend/beforeselling/**"
      - "loadtest/mock-ai/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

# 연달아 머지되면 앞선 실행은 취소하고 최신 커밋만 검증한다.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - name: Node 22 설치
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            frontend/palgijeonae/package-lock.json
            e2e/package-lock.json

      - name: FE 의존성 설치
        working-directory: frontend/palgijeonae
        run: npm ci

      - name: E2E 의존성·브라우저 설치
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: JDK 25 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Docker 안에서 Gradle을 받으면 캐시가 없어 services.gradle.org 504에 자주 걸린다.
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: BE jar 빌드
        working-directory: backend/beforeselling
        run: ./gradlew bootJar

      # 실패했을 때 BE·mock-ai 로그를 남기려고 스택은 테스트와 따로 띄우고 내린다.
      - name: E2E 스택 실행 (BE·DB·Redis·mock-ai)
        env:
          E2E_APP_TARGET: deploy
        run: |
          docker compose -f compose.e2e.yml up -d --build --wait
          docker compose -f compose.e2e.yml exec -T db psql -U e2e -d beforeselling < seed/users.sql

      - name: E2E 테스트
        env:
          E2E_KEEP_STACK: "1"
        run: npx playwright test

      - name: 스택 로그 저장 (실패 시)
        if: failure()
        run: docker compose -f compose.e2e.yml logs --no-color > stack.log

      - name: 테스트 결과 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/stack.log
          retention-days: 7

      - name: Discord 알림 (실패 시)
        if: failure() && github.event_name != 'pull_request'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_E2E_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::DISCORD_E2E_WEBHOOK이 없어 알림을 건너뜁니다."
            exit 0
          fi
          TITLE=$(printf '%s' "$COMMIT_MSG" | head -n 1 | cut -c1-200)
          jq -n \
            --arg run "$RUN_URL" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "${GITHUB_SHA::7}" \
            --arg actor "$GITHUB_ACTOR" \
            --arg title "${TITLE:-수동 실행}" \
            '{embeds: [{
               title: "❌ E2E 테스트 실패",
               url: $run,
               color: 15548997,
               description: "실행 화면 아래 Artifacts에서 e2e-report를 받아 확인하세요.",
               fields: [
                 {name: "브랜치", value: $ref, inline: true},
                 {name: "커밋", value: $sha, inline: true},
                 {name: "실행자", value: $actor, inline: true},
                 {name: "커밋 메시지", value: $title}
               ]
             }]}' \
          | curl -fsS -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"

      - name: E2E 스택 정리
        if: always()
        run: docker compose -f compose.e2e.yml down -v
