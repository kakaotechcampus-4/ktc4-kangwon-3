name: AI CI/CD

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "ai/**"
  push:
    branches: [develop]
    paths:
      - "ai/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: ktc4-kangwon3-deploy
  APP_DIR: /home/ubuntu/ai-app

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트 실행
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 도커 이미지 빌드 (GHA 캐시 적용)
        uses: docker/build-push-action@v6
        with:
          context: ./ai
          push: false
          load: true
          tags: ai-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 도커 이미지 산출물 검증
        run: docker run --rm ai-server:ci ls app/prompts/extraction.md

  deploy:
    needs: [test, docker-build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: 빌드 결과물 업로드
        run: |
          tar czf /tmp/ai-app.tar.gz -C ai --exclude='.git' --exclude='venv' --exclude='.venv' --exclude='__pycache__' --exclude='.env' .
          aws s3 cp /tmp/ai-app.tar.gz "s3://${S3_BUCKET}/ai-app-${GITHUB_SHA}.tar.gz"

      - name: 배포 실행
        uses: ./.github/actions/ssm-run
        with:
          instance-id: ${{ vars.INSTANCE_ID }}
          label: ai deploy
          commands: |
            mkdir -p ${{ env.APP_DIR }}
            aws s3 cp s3://${{ env.S3_BUCKET }}/ai-app-${{ github.sha }}.tar.gz /tmp/ai-app.tar.gz
            rm -rf ${{ env.APP_DIR }}/release && mkdir -p ${{ env.APP_DIR }}/release
            tar xzf /tmp/ai-app.tar.gz -C ${{ env.APP_DIR }}/release
            cp ${{ env.APP_DIR }}/.env ${{ env.APP_DIR }}/release/.env
            cd ${{ env.APP_DIR }}/release
            docker compose up -d --build --remove-orphans --wait --wait-timeout 120
            curl -sf http://localhost:8000/api/ai/v1/health/ready || exit 1
            docker compose ps
            docker image prune -f
