name: AI CI/CD

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "ai/**"
  push:
    branches: [develop]
    paths:
      - "ai/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: ktc4-kangwon3-deploy
  APP_DIR: /home/ubuntu/ai-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4

      # 1. Python 환경 및 pip 캐시
      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트 실행
        run: pytest

      # 2. Docker 빌드 환경 설정
      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      # 3. Docker 빌드 검증 및 GHA 레이어 캐싱
      - name: 도커 이미지 빌드 (GHA 캐시 적용)
        uses: docker/build-push-action@v6
        with:
          context: ./ai
          push: false
          load: true # 빌드된 이미지를 로컬 도커 데몬으로 로드
          tags: ai-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. 이미지 내부 에셋 스모크 테스트
      - name: 도커 이미지 산출물 검증
        run: |
          docker run --rm ai-server:ci ls app/prompts/extraction.md

  deploy:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: 빌드 결과물 업로드
        run: |
          tar czf /tmp/ai-app.tar.gz -C ai --exclude='.git' --exclude='venv' --exclude='.venv' --exclude='__pycache__' --exclude='.env' .
          aws s3 cp /tmp/ai-app.tar.gz "s3://${S3_BUCKET}/ai-app-${GITHUB_SHA}.tar.gz"

      - name: 서버 준비
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids "${{ vars.INSTANCE_ID }}" \
                  --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "현재 상태: $STATE"
          if [ "$STATE" != "running" ]; then
            echo "서버를 시작합니다..."
            aws ec2 start-instances --instance-ids "${{ vars.INSTANCE_ID }}"
            aws ec2 wait instance-running --instance-ids "${{ vars.INSTANCE_ID }}"
          fi
          echo "SSM 에이전트 연결 대기..."
          for i in $(seq 1 30); do
            PING=$(aws ssm describe-instance-information \
                   --filters "Key=InstanceIds,Values=${{ vars.INSTANCE_ID }}" \
                   --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "")
            if [ "$PING" = "Online" ]; then echo "준비 완료"; exit 0; fi
            sleep 10
          done
          echo "::error::SSM 에이전트가 응답하지 않습니다"; exit 1

      - name: 배포 실행
        run: |
          cat > /tmp/params.json <<EOF
          {"commands":[
            "set -euo pipefail",
            "mkdir -p ${APP_DIR}",
            "aws s3 cp s3://${S3_BUCKET}/ai-app-${GITHUB_SHA}.tar.gz /tmp/ai-app.tar.gz",
            "rm -rf ${APP_DIR}/release && mkdir -p ${APP_DIR}/release",
            "tar xzf /tmp/ai-app.tar.gz -C ${APP_DIR}/release",
            "cp ${APP_DIR}/.env ${APP_DIR}/release/.env",
            "cd ${APP_DIR}/release",
            "docker compose up -d --build --remove-orphans",
            "docker compose ps",
            "docker image prune -f"
          ]}
          EOF

          CMD=$(aws ssm send-command \
                --instance-ids "${{ vars.INSTANCE_ID }}" \
                --document-name AWS-RunShellScript \
                --comment "ai deploy ${GITHUB_SHA:0:7}" \
                --parameters file:///tmp/params.json \
                --query 'Command.CommandId' --output text)
          echo "CommandId: $CMD"

          for i in $(seq 1 60); do
            ST=$(aws ssm get-command-invocation --command-id "$CMD" \
                 --instance-id "${{ vars.INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          echo "----- 실행 로그 -----"
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "${{ vars.INSTANCE_ID }}" --query 'StandardOutputContent' --output text
          echo "----- 에러 로그 -----"
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "${{ vars.INSTANCE_ID }}" --query 'StandardErrorContent' --output text

          [ "$ST" = "Success" ] || { echo "::error::배포 실패 ($ST)"; exit 1; }
