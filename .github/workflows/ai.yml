name: AI CI/CD

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "ai/**"
  push:
    branches: [develop]
    paths:
      - "ai/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: beforeselling-ai-app
  APP_DIR: /home/ubuntu/ai-app

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
        with:
          # 바뀐 줄 커버리지(diff-cover)가 base 브랜치와 비교하므로 전체 이력 필요
          fetch-depth: 0

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 단위 테스트 실행 (커버리지 측정)
        run: pytest -m "not external_api and not integration" --cov --cov-report=
        env:
          COVERAGE_FILE: .coverage.unit

      - name: 통합 테스트 실행 (커버리지 측정)
        run: pytest -m integration --cov --cov-report=
        env:
          COVERAGE_FILE: .coverage.integration

      - name: 커버리지 리포트 생성 (단위, 합산)
        run: |
          # 단위는 판단 로직 패키지만 (BE 단위 리포트의 domain·application에 해당)
          COVERAGE_FILE=.coverage.unit coverage json -o coverage-unit.json \
            --include="app/agents/*,app/tools/*,app/pipeline/*,app/diagnosis/*,app/sessions/*,app/callbacks/*,app/results/*"
          coverage combine --keep .coverage.unit .coverage.integration
          coverage report
          coverage json -o coverage.json
          coverage xml -o coverage.xml

      - name: 커버리지 기준 검사 (단위 라인·분기 90%, 합산 라인 85%·분기 80%)
        run: |
          python scripts/check_coverage.py coverage-unit.json --line 90 --branch 90
          python scripts/check_coverage.py coverage.json --line 85 --branch 80

      - name: 바뀐 줄 커버리지 검사 (90%)
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=90

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 도커 이미지 빌드 (GHA 캐시 적용)
        uses: docker/build-push-action@v6
        with:
          context: ./ai
          push: false
          load: true
          tags: ai-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 도커 이미지 산출물 검증
        run: docker run --rm ai-server:ci ls app/agents/extraction/prompt.md

      - name: AWS 자격증명 설정
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: ECR push
        if: github.event_name != 'pull_request'
        run: |
          docker tag ai-server:ci "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push -q "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

  deploy:
    needs: [test, docker-build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # job 레벨이라 PR CI는 막지 않음. 연달아 머지해도 배포가 하나씩 차례로 돎
    concurrency:
      group: ai-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: 배포 파일 업로드
        run: |
          tar czf /tmp/ai-deploy.tar.gz -C ai docker-compose.yml db
          aws s3 cp /tmp/ai-deploy.tar.gz "s3://${S3_BUCKET}/ai/deploy-${GITHUB_SHA}.tar.gz"

      - name: 배포 실행
        uses: ./.github/actions/ssm-run
        with:
          instance-id: ${{ vars.INSTANCE_ID }}
          label: ai deploy
          commands: |
            mkdir -p ${{ env.APP_DIR }}
            ECR_IMAGE=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            docker pull -q "$ECR_IMAGE"
            docker logout ${{ env.ECR_REGISTRY }}
            docker tag "$ECR_IMAGE" ai-server:${{ github.sha }}
            docker tag "$ECR_IMAGE" ai-server:latest
            aws s3 cp s3://${{ env.S3_BUCKET }}/ai/deploy-${{ github.sha }}.tar.gz /tmp/ai-deploy.tar.gz
            rm -rf ${{ env.APP_DIR }}/release && mkdir -p ${{ env.APP_DIR }}/release
            tar xzf /tmp/ai-deploy.tar.gz -C ${{ env.APP_DIR }}/release
            cp ${{ env.APP_DIR }}/.env ${{ env.APP_DIR }}/release/.env
            cd ${{ env.APP_DIR }}/release
            docker network inspect be-ai-net >/dev/null 2>&1 || docker network create be-ai-net
            IMAGE_TAG=${{ github.sha }} docker compose up -d --no-build --remove-orphans --wait --wait-timeout 120
            curl -sf http://localhost:8000/api/ai/v1/health/ready || exit 1
            docker compose ps
            docker image prune -a -f
