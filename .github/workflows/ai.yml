name: AI CI/CD

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "ai/**"
  push:
    branches: [develop]
    paths:
      - "ai/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: ktc4-kangwon3-deploy
  APP_DIR: /home/ubuntu/ai-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트 실행
        run: pytest

  deploy:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: 이미지 빌드 및 업로드
        run: |
          docker build -t "ai-server:${GITHUB_SHA}" ai
          docker save "ai-server:${GITHUB_SHA}" | gzip > /tmp/ai-image.tar.gz
          aws s3 cp /tmp/ai-image.tar.gz "s3://${S3_BUCKET}/ai-image-${GITHUB_SHA}.tar.gz"
          aws s3 cp ai/docker-compose.yml \
            "s3://${S3_BUCKET}/ai-docker-compose-${GITHUB_SHA}.yml"

      - name: 서버 준비
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids "${{ vars.INSTANCE_ID }}" \
                  --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "현재 상태: $STATE"
          if [ "$STATE" != "running" ]; then
            echo "서버를 시작합니다..."
            aws ec2 start-instances --instance-ids "${{ vars.INSTANCE_ID }}"
            aws ec2 wait instance-running --instance-ids "${{ vars.INSTANCE_ID }}"
          fi
          echo "SSM 에이전트 연결 대기..."
          for i in $(seq 1 30); do
            PING=$(aws ssm describe-instance-information \
                   --filters "Key=InstanceIds,Values=${{ vars.INSTANCE_ID }}" \
                   --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "")
            if [ "$PING" = "Online" ]; then echo "준비 완료"; exit 0; fi
            sleep 10
          done
          echo "::error::SSM 에이전트가 응답하지 않습니다"; exit 1

      - name: 배포 실행
        run: |
          cat > /tmp/params.json <<EOF
          {"commands":[
            "#!/bin/bash",
            "set -euo pipefail",
            "aws s3 cp s3://${S3_BUCKET}/ai-image-${GITHUB_SHA}.tar.gz /tmp/ai-image.tar.gz",
            "gunzip -c /tmp/ai-image.tar.gz | docker load",
            "rm -rf ${APP_DIR}/release && mkdir -p ${APP_DIR}/release",
            "aws s3 cp s3://${S3_BUCKET}/ai-docker-compose-${GITHUB_SHA}.yml ${APP_DIR}/release/docker-compose.yml",
            "cp ${APP_DIR}/.env ${APP_DIR}/release/.env",
            "cd ${APP_DIR}/release",
            "IMAGE_TAG=${GITHUB_SHA} docker compose up -d --remove-orphans",
            "docker compose ps",
            "docker image prune -f"
          ]}
          EOF

          CMD=$(aws ssm send-command \
                --instance-ids "${{ vars.INSTANCE_ID }}" \
                --document-name AWS-RunShellScript \
                --comment "ai deploy ${GITHUB_SHA:0:7}" \
                --parameters file:///tmp/params.json \
                --query 'Command.CommandId' --output text)
          echo "CommandId: $CMD"

          for i in $(seq 1 60); do
            ST=$(aws ssm get-command-invocation --command-id "$CMD" \
                 --instance-id "${{ vars.INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          echo "----- 실행 로그 -----"
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "${{ vars.INSTANCE_ID }}" --query 'StandardOutputContent' --output text
          echo "----- 에러 로그 -----"
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "${{ vars.INSTANCE_ID }}" --query 'StandardErrorContent' --output text

          [ "$ST" = "Success" ] || { echo "::error::배포 실패 ($ST)"; exit 1; }
