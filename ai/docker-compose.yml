name: ai

services:
  ai:
    build:
      context: .
    image: ai-server:${IMAGE_TAG:-latest}
    container_name: ai-server
    restart: unless-stopped
    mem_limit: 1g
    environment:
      TZ: Asia/Seoul

      # 에이전트 환경변수
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}

      # BE URL 환경변수
      BE_BASE_URL: ${BE_BASE_URL:-http://be-server:8080}
      
      # AI DB URL 환경변수
      DATABASE_URL: ${DATABASE_URL}

      # 외부 API 클라이언트 환경변수
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY}
      KEY_SAFETYKOREA: ${KEY_SAFETYKOREA}
      LAW_GO_KR_OC: ${LAW_GO_KR_OC}
    ports:
      - "8000:8000"
    depends_on:
      ai-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/ai/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [ai-net, be-ai-net]

  ai-db:
    image: pgvector/pgvector:pg16
    container_name: ai-db
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${AI_DB_NAME:-ai}
      POSTGRES_USER: ${AI_DB_USERNAME:-ai}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD:-ai}
      TZ: Asia/Seoul
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=30
    ports:
      - "5433:5432"
    volumes:
      - ai-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_DB_USERNAME:-ai} -d ${AI_DB_NAME:-ai}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ai-net]

volumes:
  ai-pgdata:
    name: ai-pgdata

networks:
  ai-net:
    name: ai-net
  # BE app(blue/green)과 AI만 잇는 전용 네트워크. be_appnet과 달리 BE db/redis에는 닿지 않는다.
  # BE·AI 배포 순서와 무관하도록 양쪽 워크플로가 없으면 만든다. 로컬은 처음 한 번 `docker network create be-ai-net`.
  be-ai-net:
    name: be-ai-net
    external: true
