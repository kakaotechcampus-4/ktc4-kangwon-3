[pytest]
# `app` 패키지를 바로 import할 수 있게 ai/를 경로에 둔다.
pythonpath = .
# 폴더가 달라도 같은 이름의 테스트 파일을 둘 수 있게 importlib 방식으로 import
# 실제 외부 API를 호출하는 테스트는 기본 실행(CI 포함)에서 제외. 실행: pytest -m integration
addopts = --import-mode=importlib -m "not integration"
markers =
    integration: 실제 외부 API를 호출하는 테스트 (키 필요, CI 제외)
