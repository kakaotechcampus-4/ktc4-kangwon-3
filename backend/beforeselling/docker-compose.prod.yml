services:
  db:
    ports: !reset []
  redis:
    ports: !reset []
  app:
    ports: !reset []

  nginx:
    image: nginx:alpine
    container_name: app-nginx
    restart: unless-stopped
    depends_on: [ app ]
    ports: [ "80:80", "443:443" ]
    volumes:
      - /home/ubuntu/app/infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - /home/ubuntu/app/frontend/current:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done
                     & nginx -g 'daemon off;'"
    networks: [ appnet ]

  certbot:
    image: certbot/certbot
    container_name: app-certbot
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot;
                  sleep 12h & wait $${!}; done"

volumes:
  certbot-webroot:
