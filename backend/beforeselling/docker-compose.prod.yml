services:
  db:
    ports: !reset []
  redis:
    ports: !reset []

  # 단일 app은 base 파일만 쓸 때(로컬)용, 운영에서는 blue/green 배포 방식으로 수행.
  app:
    profiles: ["local"]

  app-blue:
    extends: { file: docker-compose.yml, service: app }
    container_name: be-server-blue
    ports: !override ["8080:8080"]
    networks:
      appnet:
        aliases: [be-server]

  app-green:
    extends: { file: docker-compose.yml, service: app }
    container_name: be-server-green
    ports: !override ["8082:8080"]
    networks:
      appnet:
        aliases: [be-server]
