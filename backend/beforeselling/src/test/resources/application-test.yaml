spring:
  datasource:
    url: jdbc:h2:mem:beforeselling;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret

jwt:
  secret: test-jwt-secret-key-must-be-at-least-32-bytes-long-0123456789
  access-token-expiration: 30m
  refresh-token-expiration: 14d

app:
  cors:
    allowed-origins: http://localhost:5173
  oauth2:
    frontend-redirect-uri: http://localhost:5173/oauth/callback
  cookie:
    secure: false
    same-site: Lax

oauth2:
  unlink:
    kakao:
      admin-key: test-kakao-admin-key

crypto:
  secret-key: eXlMlYPHwWqnT+Ql6zvX4S8LW2HE8wIVht91Mjr59Jg=

aws:
  s3:
    access-key: test-access-key
    secret-key: test-secret-key
    bucket: test-bucket
    region: ap-northeast-2
    presigned-url-expiration: PT5M
    max-file-size: 10MB
    allowed-extensions: jpg,jpeg,png,webp
