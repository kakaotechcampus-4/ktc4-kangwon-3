spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/beforeselling}
    username: ${DB_USERNAME:beforeselling}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security: debug
